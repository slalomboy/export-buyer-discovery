<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640" role="img" aria-labelledby="title desc">
<title id="title">Export Buyer Discovery</title><desc id="desc">Four steps from product facts to market fit, company discovery and purchasing-role evidence.</desc>
<defs><linearGradient id="bg" x2="1" y2="1"><stop stop-color="#102535"/><stop offset="1" stop-color="#153e48"/></linearGradient></defs>
<rect width="1280" height="640" rx="24" fill="url(#bg)"/>
<g font-family="Arial, Helvetica, sans-serif"><text x="64" y="76" fill="#77dfce" font-size="18" letter-spacing="3">AN AGENT SKILL FOR EXPORT TEAMS</text>
<text x="60" y="145" fill="#ffffff" font-size="56" font-weight="700">Export Buyer Discovery</text>
<text x="64" y="195" fill="#bfd0d7" font-size="26">From product facts to buyer evidence</text>
<rect x="64" y="260" width="270" height="206" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#75bdba" stroke-opacity="0.4"/><text x="84" y="306" fill="#77dfce" font-size="28" font-weight="700">01</text><text x="84" y="350" fill="#ffffff" font-size="16" font-weight="700">SUPPLY PROFILE</text><text x="84" y="394" fill="#d0e1e7" font-size="17">Product + factory facts</text><text x="84" y="424" fill="#d0e1e7" font-size="17">Keep unknowns explicit</text><rect x="356" y="260" width="270" height="206" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#75bdba" stroke-opacity="0.4"/><text x="376" y="306" fill="#77dfce" font-size="28" font-weight="700">02</text><text x="376" y="350" fill="#ffffff" font-size="16" font-weight="700">MARKET FIT</text><text x="376" y="394" fill="#d0e1e7" font-size="17">Compare countries</text><text x="376" y="424" fill="#d0e1e7" font-size="17">Explain the evidence</text><rect x="648" y="260" width="270" height="206" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#75bdba" stroke-opacity="0.4"/><text x="668" y="306" fill="#77dfce" font-size="28" font-weight="700">03</text><text x="668" y="350" fill="#ffffff" font-size="16" font-weight="700">COMPANY DISCOVERY</text><text x="668" y="394" fill="#d0e1e7" font-size="17">Find + deduplicate</text><text x="668" y="424" fill="#d0e1e7" font-size="17">Check products and role</text><rect x="940" y="260" width="270" height="206" rx="18" fill="#ffffff" fill-opacity="0.07" stroke="#75bdba" stroke-opacity="0.4"/><text x="960" y="306" fill="#77dfce" font-size="28" font-weight="700">04</text><text x="960" y="350" fill="#ffffff" font-size="16" font-weight="700">BUYER VERIFICATION</text><text x="960" y="394" fill="#d0e1e7" font-size="17">Current role + contacts</text><text x="960" y="424" fill="#d0e1e7" font-size="17">Separate public channels</text><path d="M64 511 H1210" stroke="#5b9295"/><text x="64" y="554" fill="#e3f2f3" font-size="22">Company fit  /  Buyer role  /  Contact evidence  /  Purchase demand</text><text x="64" y="599" fill="#a2c1c8" font-size="17">Keep each decision separate. Preserve sources, dates, gaps and next checks.</text></g></svg>